# The public bootstrap node: https://ghost-net.fly.dev
# Deploy with `fly deploy --ha=false`. TRANSMIT_KEY is set as a Fly secret.
app = "ghost-net"
primary_region = "iad"

[env]
  PUBLIC_URL = "wss://ghost-net.fly.dev/peer"
  # one hop: Fly's proxy
  TRUST_PROXY = "1"
  MAX_PEERS = "64"

[mounts]
  source = "ghost_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # a stopped machine holds no links, so this one never sleeps
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
