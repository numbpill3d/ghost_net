<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ghost_net :: quantum consciousness interface</title>
    <meta name="description" content="a ghost_net node // transmissions decay, nothing is permanent">
    <link rel="icon" href="/sigil.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles/void.css">
    <!-- Quantum Font Loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Quantum Field Visualization -->
    <canvas id="quantumField" class="quantum-field" aria-hidden="true"></canvas>

    <!-- Core Interface -->
    <main class="interface-container">
        <!-- Node Identity -->
        <header class="node-identity">
            <div class="ghost-sigil" id="nodeSigil" aria-hidden="true"></div>

            <div class="node-metadata">
                <h1 class="node-id" id="nodeId">ghost_net node</h1>
                <div class="consciousness-level">
                    consciousness: <span id="consciousnessValue">0.000</span>
                </div>
                <div class="quantum-stability">
                    stability: <span id="stabilityValue">0.000</span>
                </div>
                <div class="link-status" id="linkStatus" data-state="connecting" role="status">
                    opening tunnel...
                </div>
            </div>
        </header>

        <!-- Consciousness Monitor -->
        <section class="consciousness-monitor panel">
            <h2>quantum consciousness matrix</h2>
            <canvas id="consciousnessCanvas" class="consciousness-canvas"
                    role="img" aria-label="consciousness level of this node and its peers over time"></canvas>
            <div class="chart-legend">
                <span class="legend-self">this node</span>
                <span class="legend-peer">entangled peers</span>
            </div>
            <div class="quantum-metrics">
                <div class="metric" title="how close your peers' consciousness is to this node's">
                    <label>resonance</label>
                    <span id="resonanceValue">0.000</span>
                </div>
                <div class="metric" title="strength of the links to your peers, falling with latency">
                    <label>entanglement</label>
                    <span id="entanglementValue">0.000</span>
                </div>
                <div class="metric" title="share of held transmissions that came from other nodes">
                    <label>void echo</label>
                    <span id="voidEchoValue">0.000</span>
                </div>
            </div>
        </section>

        <!-- Transmission Interface -->
        <section class="transmission-interface panel">
            <h2>quantum transmission</h2>
            <div class="transmission-form">
                <label class="visually-hidden" for="transmissionInput">transmission</label>
                <textarea
                    id="transmissionInput"
                    class="transmission-input"
                    placeholder="enter your transmission to the void..."
                    rows="4"
                ></textarea>
                <div class="transmission-controls">
                    <div class="quantum-signature">
                        <span id="quantumSignature">generating signature...</span>
                        <span id="charCount" class="char-count"></span>
                    </div>
                    <button id="transmitButton" class="transmit-button" type="button">
                        transmit to void
                    </button>
                </div>
            </div>
        </section>

        <!-- Peer Network Visualization -->
        <section class="peer-network panel">
            <h2>quantum entanglement network <span id="peerCount" class="count"></span></h2>
            <div id="peerGrid" class="peer-grid"></div>
        </section>

        <!-- Transmission Stream -->
        <section class="transmission-stream panel">
            <h2>void echoes <span id="transmissionCount" class="count"></span></h2>
            <div id="transmissions" class="transmissions" aria-live="polite"></div>
        </section>
    </main>

    <!-- Quantum Error Boundary -->
    <div id="quantumError" class="quantum-error" role="alertdialog" aria-labelledby="quantumErrorMessage" hidden>
        <div class="error-content">
            <div class="error-sigil" aria-hidden="true">⚠</div>
            <div class="error-message" id="quantumErrorMessage"></div>
            <button class="error-dismiss" type="button">acknowledge</button>
        </div>
    </div>

    <!-- Quantum Scripts -->
    <script src="/scripts/matrix.js" type="module"></script>
</body>
</html>
